<svg width="120" height="128" viewBox="0 0 120 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="1st Acropolis Wolt Cup">
  <defs>
    <linearGradient id="hdl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b070"/>
      <stop offset="1" stop-color="#d98f43"/>
    </linearGradient>
  </defs>
  <!-- handle, tilted 45° -->
  <g transform="rotate(45 59 55)">
    <rect x="49" y="92" width="20" height="48" rx="10" fill="url(#hdl)"/>
    <rect x="49" y="92" width="20" height="16" rx="10" fill="#c67f37"/>
  </g>
  <!-- white blade (reads on the blue header) -->
  <circle cx="59" cy="55" r="50" fill="#ffffff"/>
  <!-- Parthenon in Wolt blue -->
  <g fill="#009de0">
    <path d="M59 22 L30 44 L88 44 Z"/>
    <rect x="31" y="45.5" width="56" height="6" rx="1.5"/>
    <rect x="33" y="53" width="6" height="27" rx="1"/>
    <rect x="45" y="53" width="6" height="27" rx="1"/>
    <rect x="56" y="53" width="6" height="27" rx="1"/>
    <rect x="67" y="53" width="6" height="27" rx="1"/>
    <rect x="79" y="53" width="6" height="27" rx="1"/>
    <rect x="30" y="81" width="58" height="5" rx="1.5"/>
    <rect x="27" y="87" width="64" height="5" rx="1.5"/>
  </g>
  <!-- orange ball -->
  <circle cx="103" cy="24" r="13" fill="#ff8a00"/>
  <ellipse cx="98.5" cy="19.5" rx="3.4" ry="4.4" fill="#ffffff" opacity=".75"/>
</svg>
